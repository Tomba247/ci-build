name: Mac runner disk check

on:
  push:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Machine info
        run: |
          sw_vers
          sysctl -n machdep.cpu.brand_string
          echo "CPU cores: $(sysctl -n hw.ncpu)"
          echo "RAM: $(( $(sysctl -n hw.memsize) / 1024 / 1024 / 1024 )) GB"
          xcodebuild -version || true

      - name: Disk space before cleanup
        run: df -h /

      - name: Biggest removable folders
        run: |
          sudo du -sh /Applications/Xcode*.app 2>/dev/null || true
          sudo du -sh ~/Library/Android 2>/dev/null || true
          sudo du -sh /Library/Developer/CoreSimulator 2>/dev/null || true
          sudo du -sh ~/Library/Developer/CoreSimulator 2>/dev/null || true
          sudo du -sh /usr/local/share/dotnet ~/.dotnet 2>/dev/null || true
          sudo du -sh ~/hostedtoolcache /Users/runner/hostedtoolcache 2>/dev/null || true

      - name: Free space (keep only the default Xcode)
        run: |
          default_xcode="$(xcode-select -p | sed 's#/Contents/Developer##')"
          echo "Keeping $default_xcode"
          for x in /Applications/Xcode*.app; do
            [ "$(cd "$x" && pwd -P)" = "$(cd "$default_xcode" && pwd -P)" ] || sudo rm -rf "$x"
          done
          sudo rm -rf ~/Library/Android /usr/local/share/dotnet ~/.dotnet /Users/runner/hostedtoolcache
          xcrun simctl delete all 2>/dev/null || true
          xcrun simctl runtime delete all 2>/dev/null || true

      - name: Disk space after cleanup
        run: df -h /
